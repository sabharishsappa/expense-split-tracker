name: Build APK

on:
  push:
    branches: [main, money-manager-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare signing key (from encrypted secrets, never from the repository)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key from secrets"
          else
            echo "Signing secrets are missing: refusing to publish an APK signed with a throwaway key"
            exit 1
          fi
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SplitTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build app bundle for Google Play
        run: gradle bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SplitTracker-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Publish as release "latest" (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SplitTracker.apk
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            gh release delete latest -y --cleanup-tag || true
            gh release create latest SplitTracker.apk --title "Latest build" --notes "Debug build of commit ${GITHUB_SHA::7}"
          else
            # branch builds never touch the "latest" download
            gh release delete ui-preview -y --cleanup-tag || true
            gh release create ui-preview SplitTracker.apk --prerelease --title "UI preview (${GITHUB_REF_NAME})" --notes "Preview build of commit ${GITHUB_SHA::7} from branch ${GITHUB_REF_NAME}. Not the main app."
          fi
