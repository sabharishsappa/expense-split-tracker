name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SplitTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as release "latest" (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SplitTracker.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SplitTracker.apk --title "Latest build" --notes "Debug build of commit ${GITHUB_SHA::7}"
